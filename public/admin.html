<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>АДМИНКА ШУМОДАВА!!!</title><link rel="stylesheet" href="/admin.css">
</head>
<body>
<main>
<h1>💀 АДМИНКА ШУМОДАВА 💀</h1>
<p>Если вы не админ — уходите. Если админ — тоже можете уйти.</p>

<section id="login">
<h2>🔐 1. ВХОД В ПОДВАЛ</h2>
<input id="password" type="password" placeholder="ваш пароль">
<button onclick="login()">ВОЙТИ В АДМИНКУ</button>
<p id="login-status"></p>
</section>

<div id="panel" style="display:none">
<section>
<h2>2. НОВАЯ НОВОСТЬ</h2>
<textarea id="news" placeholder="ВНИМАНИЕ ИДЕТ РОЗЫГРЫШ КРЫШКИ ОТ ШВЕПСА"></textarea>
<button onclick="addNews()">ВЫПУСТИТЬ НОВОСТЬ</button>
</section>

<section>
<h2>3. ЗАГРУЗИТЬ МУЗЫКУ</h2>
<input id="title" placeholder="Название трека"><br>
<input id="artist" placeholder="Исполнитель" value="ШУМОДАВ"><br>
<input id="description" placeholder="Описание"><br>
<input id="music" type="file" accept="audio/*">
<button onclick="uploadMusic()">ЗАГРУЗИТЬ ШУМ</button>
<p id="status"></p>
</section>

<section>
<h2>4. СМЕНИТЬ ФОН</h2>
<p>Вставь прямую ссылку на GIF/JPG.</p>
<input id="background" style="width:95%" placeholder="https://.../nyancat.gif"><br>
<input id="marquee" style="width:95%" placeholder="Текст бегущей строки"><br>
<button onclick="saveSettings()">СОХРАНИТЬ НАСТРОЙКИ</button>
</section>

<section><h2>ТЕКУЩИЕ НОВОСТИ</h2><div id="current-news"></div></section>
<section><h2>ЗАГРУЖЕННЫЕ ТРЕКИ</h2><div id="current-tracks"></div></section>
<button onclick="logout()">🚪 ВЫЙТИ</button>
</div>
<a href="/">← БЕЖАТЬ НА ГЛАВНУЮ</a>
</main>

<script>
let adminPassword='';
const H=()=>({'x-admin-password':adminPassword});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function msg(x){document.getElementById('status').textContent=x}

async function login(){
  const p=document.getElementById('password').value;
  if(!p){document.getElementById('login-status').textContent='ВВЕДИ ПАРОЛЬ, БРАТ';return}
  const r=await fetch('/api/admin-check',{method:'POST',headers:{'x-admin-password':p}});
  if(!r.ok){document.getElementById('login-status').textContent='❌ ПАРОЛЬ НЕВЕРНЫЙ';return}
  adminPassword=p;
  document.getElementById('login').style.display='none';
  document.getElementById('panel').style.display='block';
  document.getElementById('login-status').textContent='';
  load();
}
function logout(){
  adminPassword='';
  document.getElementById('panel').style.display='none';
  document.getElementById('login').style.display='block';
  document.getElementById('password').value='';
}
async function api(url,options={}){
  options.headers={...(options.headers||{}),...H()};
  const r=await fetch(url,options);
  let j={}; try{j=await r.json()}catch{}
  if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
  return j;
}
async function addNews(){
  try{
    const r=await api('/api/news',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text:document.getElementById('news').value})});
    msg(r.ok?'НОВОСТЬ ВЫПУЩЕНА!!!':'ОШИБКА');
    document.getElementById('news').value=''; load();
  }catch(e){msg('❌ '+e.message)}
}
async function editNews(id,oldText){
  const text=prompt('ПЕРЕПИСАТЬ НОВОСТЬ:',oldText);
  if(text===null)return;
  try{await api('/api/news/'+id,{method:'PUT',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text})});load();msg('НОВОСТЬ ПЕРЕПИСАНА!!!')}
  catch(e){msg('❌ '+e.message)}
}
async function uploadMusic(){
  let f=document.getElementById('music').files[0];
  if(!f)return alert('СНАЧАЛА ВЫБЕРИ ФАЙЛ');
  let d=new FormData();d.append('music',f);d.append('title',document.getElementById('title').value);d.append('artist',document.getElementById('artist').value);d.append('description',document.getElementById('description').value);
  msg('ЗАГРУЖАЕМ ШУМ...');
  try{const j=await api('/api/upload',{method:'POST',body:d});msg(j.ok?'МУЗЫКА ЗАГРУЖЕНА!!!':j.error);if(j.ok)load()}catch(e){msg('❌ '+e.message)}
}
async function saveSettings(){
  let b=new URLSearchParams({background_url:document.getElementById('background').value,marquee_text:document.getElementById('marquee').value,site_title:'ШУМОДАВ'});
  try{const j=await api('/api/settings',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:b});msg(j.ok?'НАСТРОЙКИ СОХРАНЕНЫ!!!':j.error)}catch(e){msg('❌ '+e.message)}
}
async function load(){
  try{
    const[n,t,s]=await Promise.all([fetch('/api/news').then(r=>r.json()),fetch('/api/tracks').then(r=>r.json()),fetch('/api/settings').then(r=>r.json())]);
    document.getElementById('current-news').innerHTML=n.map(x=>`<div class="item"><b>${esc(x.text)}</b><br><button onclick='editNews(${x.id},${JSON.stringify(x.text)})'>✏️ ИЗМЕНИТЬ</button><button onclick="delNews(${x.id})">🗑️ УДАЛИТЬ</button></div>`).join('')||'ПУСТО';
    document.getElementById('current-tracks').innerHTML=t.map(x=>`<div class="item"><b>${esc(x.title)}</b> — ${esc(x.artist||'')} <button onclick="delTrack(${x.id})">УДАЛИТЬ</button></div>`).join('')||'ПУСТО';
    document.getElementById('background').value=s.background_url||'';
    document.getElementById('marquee').value=s.marquee_text||'';
  }catch(e){msg('❌ '+e.message)}
}
async function delNews(id){try{await api('/api/news/'+id,{method:'DELETE'});load()}catch(e){msg('❌ '+e.message)}}
async function delTrack(id){if(!confirm('ТОЧНО УДАЛИТЬ ЭТОТ ШУМ?'))return;try{await api('/api/tracks/'+id,{method:'DELETE'});load()}catch(e){msg('❌ '+e.message)}}
</script>
</body></html>
