<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>АДМИНКА ШУМОДАВА!!!</title><link rel="stylesheet" href="/admin.css"></head><body><main><h1>💀 АДМИНКА ШУМОДАВА 💀</h1><p>Если вы не админ — уходите. Если админ — тоже можете уйти.</p><section><h2>1. ПАРОЛЬ ОТ ПОДВАЛА</h2><input id="password" type="password" placeholder="ваш пароль"></section><section><h2>2. НОВАЯ НОВОСТЬ</h2><textarea id="news" placeholder="ВНИМАНИЕ ИДЕТ РОЗЫГРЫШ КРЫШКИ ОТ ШВЕПСА"></textarea><button onclick="addNews()">ВЫПУСТИТЬ НОВОСТЬ</button></section><section><h2>3. ЗАГРУЗИТЬ МУЗЫКУ</h2><input id="title" placeholder="Название трека"><br><input id="artist" placeholder="Исполнитель" value="ШУМОДАВ"><br><input id="description" placeholder="Описание"><br><input id="music" type="file" accept="audio/*"><button onclick="uploadMusic()">ЗАГРУЗИТЬ ШУМ</button><p id="status"></p></section><section><h2>4. СМЕНИТЬ ФОН</h2><p>Вставь прямую ссылку на GIF/JPG.</p><input id="background" style="width:95%" placeholder="https://.../nyancat.gif"><br><input id="marquee" style="width:95%" placeholder="Текст бегущей строки"><br><button onclick="saveSettings()">СОХРАНИТЬ НАСТРОЙКИ</button></section><section><h2>ТЕКУЩИЕ НОВОСТИ</h2><div id="current-news"></div></section><section><h2>ЗАГРУЖЕННЫЕ ТРЕКИ</h2><div id="current-tracks"></div></section><a href="/">← БЕЖАТЬ НА ГЛАВНУЮ</a></main><script>
const pass=()=>document.getElementById('password').value,H=()=>({'x-admin-password':pass()});function msg(x){document.getElementById('status').textContent=x}const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function addNews(){let r=await fetch('/api/news',{method:'POST',headers:{...H(),'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({text:document.getElementById('news').value})}),j=await r.json();msg(j.ok?'НОВОСТЬ ВЫПУЩЕНА!!!':j.error);if(j.ok)document.getElementById('news').value='';load()}
async function uploadMusic(){let f=document.getElementById('music').files[0];if(!f)return alert('СНАЧАЛА ВЫБЕРИ ФАЙЛ');let d=new FormData();d.append('music',f);d.append('title',document.getElementById('title').value);d.append('artist',document.getElementById('artist').value);d.append('description',document.getElementById('description').value);msg('ЗАГРУЖАЕМ ШУМ...');let r=await fetch('/api/upload',{method:'POST',headers:H(),body:d}),j=await r.json();msg(j.ok?'МУЗЫКА ЗАГРУЖЕНА!!!':j.error);if(j.ok)load()}
async function saveSettings(){let b=new URLSearchParams({background_url:document.getElementById('background').value,marquee_text:document.getElementById('marquee').value,site_title:'ШУМОДАВ'}),r=await fetch('/api/settings',{method:'POST',headers:{...H(),'Content-Type':'application/x-www-form-urlencoded'},body:b}),j=await r.json();msg(j.ok?'НАСТРОЙКИ СОХРАНЕНЫ!!!':j.error)}
async function load(){let[n,t,s]=await Promise.all([fetch('/api/news').then(r=>r.json()),fetch('/api/tracks').then(r=>r.json()),fetch('/api/settings').then(r=>r.json())]);document.getElementById('current-news').innerHTML=n.map(x=>`<div class="item"><b>${esc(x.text)}</b> <button onclick="delNews(${x.id})">УДАЛИТЬ</button></div>`).join('')||'ПУСТО';document.getElementById('current-tracks').innerHTML=t.map(x=>`<div class="item"><b>${esc(x.title)}</b> — ${esc(x.artist||'')} <button onclick="delTrack(${x.id})">УДАЛИТЬ</button></div>`).join('')||'ПУСТО';document.getElementById('background').value=s.background_url||'';document.getElementById('marquee').value=s.marquee_text||''}
async function delNews(id){let r=await fetch('/api/news/'+id,{method:'DELETE',headers:H()});if(r.ok)load();else msg((await r.json()).error)}async function delTrack(id){if(!confirm('ТОЧНО УДАЛИТЬ ЭТОТ ШУМ?'))return;let r=await fetch('/api/tracks/'+id,{method:'DELETE',headers:H()});if(r.ok)load();else msg((await r.json()).error)}load();</script></body></html>
